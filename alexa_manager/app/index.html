<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alexa Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0f1117;
    --surface:   #1c1f2e;
    --surface2:  #242838;
    --surface3:  #2d3147;
    --border:    rgba(255,255,255,0.07);
    --border2:   rgba(255,255,255,0.12);
    --blue:      #4b93ff;
    --blue-dim:  rgba(75,147,255,0.12);
    --teal:      #00c4a0;
    --teal-dim:  rgba(0,196,160,0.12);
    --purple:    #9b7aff;
    --purple-dim:rgba(155,122,255,0.12);
    --orange:    #ff9a3c;
    --orange-dim:rgba(255,154,60,0.12);
    --green:     #2ecc71;
    --green-dim: rgba(46,204,113,0.12);
    --red:       #e74c3c;
    --red-dim:   rgba(231,76,60,0.12);
    --yellow:    #f1c40f;
    --yellow-dim:rgba(241,196,15,0.12);
    --text:      #e8eaf0;
    --text2:     #8b90a7;
    --text3:     #5a5f7a;
    --ff:        'Inter', sans-serif;
    --radius:    14px;
    --radius-sm: 9px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    font-family: var(--ff);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 10px; }

  /* ── Layout ── */
  .wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .logo-row { display: flex; align-items: center; gap: 12px; }

  .logo-icon {
    width: 40px; height: 40px;
    background: var(--blue-dim);
    border: 1px solid rgba(75,147,255,0.2);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }

  .logo-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.3px;
  }

  .logo-sub {
    font-size: 11px;
    color: var(--text3);
    font-weight: 400;
    margin-top: 1px;
  }

  .header-right { display: flex; align-items: center; gap: 8px; }

  .pill {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 100px;
    font-size: 11px;
    color: var(--text2);
    font-weight: 500;
  }

  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
    animation: pulse 2.5s ease-in-out infinite;
  }
  .dot.off { background: var(--red); box-shadow: 0 0 6px var(--red); animation: none; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .btn {
    padding: 7px 14px;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    color: var(--text2);
    font-family: var(--ff);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s;
  }
  .btn:hover { background: var(--surface2); color: var(--text); border-color: rgba(255,255,255,0.18); }

  /* ── Stats bar ── */
  .stats-bar {
    display: flex; gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .stat {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 12px;
    color: var(--text2);
    font-weight: 500;
  }

  .stat strong {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    margin-left: 2px;
  }

  .stat-icon {
    width: 28px; height: 28px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }

  /* ── Tabs ── */
  .tabs {
    display: flex; gap: 4px;
    margin-bottom: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 4px;
    width: fit-content;
    flex-wrap: wrap;
  }

  .tab {
    padding: 8px 16px;
    border-radius: 10px;
    border: none;
    background: transparent;
    color: var(--text2);
    font-family: var(--ff);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s;
    display: flex; align-items: center; gap: 6px;
    white-space: nowrap;
  }

  .tab:hover { color: var(--text); background: var(--surface2); }

  .tab.active {
    background: var(--surface3);
    color: var(--text);
    font-weight: 600;
  }

  .badge {
    background: var(--surface3);
    border-radius: 100px;
    padding: 1px 6px;
    font-size: 10px;
    font-weight: 600;
    color: var(--text3);
    min-width: 18px;
    text-align: center;
  }

  .tab.active .badge {
    background: var(--blue-dim);
    color: var(--blue);
  }

  /* ── Toolbar ── */
  .toolbar {
    display: flex; gap: 10px;
    margin-bottom: 18px;
  }

  .search-wrap { flex: 1; position: relative; }

  .search-icon {
    position: absolute; left: 12px; top: 50%;
    transform: translateY(-50%);
    color: var(--text3); font-size: 13px;
    pointer-events: none;
  }

  .search-inp {
    width: 100%;
    padding: 9px 12px 9px 34px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: var(--ff);
    font-size: 13px;
    outline: none;
    transition: border-color 0.18s, background 0.18s;
  }

  .search-inp:focus {
    border-color: rgba(75,147,255,0.4);
    background: var(--surface2);
  }

  .search-inp::placeholder { color: var(--text3); }

  .filter-sel {
    padding: 9px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text2);
    font-family: var(--ff);
    font-size: 12px;
    font-weight: 500;
    outline: none;
    cursor: pointer;
    transition: border-color 0.18s;
  }

  .filter-sel:focus { border-color: rgba(75,147,255,0.3); }
  .filter-sel option { background: var(--surface2); }

  /* ── Grid ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
    gap: 12px;
  }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    transition: border-color 0.18s, background 0.18s;
  }

  .card:hover {
    border-color: var(--border2);
    background: var(--surface2);
  }

  .card-top {
    display: flex; align-items: flex-start;
    gap: 12px; margin-bottom: 12px;
  }

  .c-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; flex-shrink: 0;
  }

  .c-info { flex: 1; min-width: 0; }

  .c-name {
    font-size: 14px; font-weight: 600;
    color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-bottom: 2px;
  }

  .c-id {
    font-size: 10px; color: var(--text3);
    font-family: 'SF Mono', 'Fira Code', monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .c-right {
    display: flex; flex-direction: column;
    align-items: flex-end; gap: 4px; flex-shrink: 0;
  }

  /* State badge */
  .s-badge {
    font-size: 10px; font-weight: 600;
    padding: 3px 8px; border-radius: 6px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .s-on     { background: var(--green-dim); color: var(--green); }
  .s-off    { background: var(--surface3); color: var(--text3); }
  .s-other  { background: var(--blue-dim); color: var(--blue); }

  /* Type badge */
  .t-badge {
    font-size: 9px; font-weight: 600;
    padding: 2px 6px; border-radius: 5px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .t-light   { background: var(--yellow-dim); color: var(--yellow); }
  .t-switch  { background: var(--blue-dim);   color: var(--blue); }
  .t-scene   { background: var(--purple-dim); color: var(--purple); }
  .t-script  { background: var(--teal-dim);   color: var(--teal); }
  .t-media   { background: var(--orange-dim); color: var(--orange); }
  .t-climate { background: var(--green-dim);  color: var(--green); }
  .t-cover   { background: var(--red-dim);    color: #ff7a7a; }
  .t-other   { background: var(--surface3);   color: var(--text3); }

  /* Phrase Alexa */
  .phrase-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--blue);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    margin-bottom: 10px;
  }

  .phrase-lbl {
    font-size: 9px; font-weight: 600;
    letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--text3); margin-bottom: 5px;
  }

  .phrase-txt {
    font-size: 13px; font-weight: 500;
    color: var(--text2); line-height: 1.4;
  }

  .phrase-txt strong { color: var(--text); font-weight: 600; }
  .phrase-txt em { font-style: normal; color: var(--text3); }

  /* Actions */
  .c-actions { display: flex; gap: 6px; }

  .act {
    flex: 1; padding: 7px 6px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text2);
    font-family: var(--ff);
    font-size: 11px; font-weight: 500;
    cursor: pointer;
    transition: all 0.18s;
    text-align: center;
  }

  .act:hover { background: var(--surface3); color: var(--text); border-color: var(--border2); }
  .act.rename:hover { border-color: rgba(75,147,255,0.35); color: var(--blue); background: var(--blue-dim); }
  .act.test:hover   { border-color: rgba(0,196,160,0.35);  color: var(--teal); background: var(--teal-dim); }
  .act.copy:hover   { border-color: rgba(155,122,255,0.35);color: var(--purple); background: var(--purple-dim); }

  /* ── Skeleton ── */
  .skeleton {
    background: linear-gradient(90deg, var(--surface2) 25%, var(--surface3) 50%, var(--surface2) 75%);
    background-size: 200% 100%;
    animation: skel 1.6s infinite;
    border-radius: 6px;
  }
  @keyframes skel { from{background-position:200% 0} to{background-position:-200% 0} }

  /* ── Empty ── */
  .empty {
    grid-column: 1/-1;
    text-align: center; padding: 60px 20px;
    color: var(--text3); font-size: 13px;
  }
  .empty .ico { font-size: 36px; margin-bottom: 12px; opacity: 0.5; }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 18px;
    padding: 28px;
    width: 100%; max-width: 440px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    transform: scale(0.96) translateY(8px);
    transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1);
  }
  .modal-overlay.open .modal { transform: scale(1) translateY(0); }

  .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .modal-sub   { font-size: 11px; color: var(--text3); font-family: monospace; margin-bottom: 20px; }

  .modal-lbl {
    font-size: 11px; font-weight: 600;
    color: var(--text2); margin-bottom: 6px;
    display: block; text-transform: uppercase; letter-spacing: 0.5px;
  }

  .modal-inp {
    width: 100%; padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: var(--ff); font-size: 15px; font-weight: 600;
    outline: none; margin-bottom: 8px;
    transition: border-color 0.18s;
  }
  .modal-inp:focus { border-color: rgba(75,147,255,0.5); }

  .modal-preview {
    font-size: 12px; color: var(--text2);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px 12px; margin-bottom: 20px;
    line-height: 1.5;
  }
  .modal-preview strong { color: var(--blue); }

  .modal-btns { display: flex; gap: 8px; }

  .m-btn {
    flex: 1; padding: 11px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border2);
    font-family: var(--ff); font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 0.18s;
  }

  .m-btn.cancel { background: var(--surface); color: var(--text2); }
  .m-btn.cancel:hover { background: var(--surface3); color: var(--text); }

  .m-btn.confirm {
    background: var(--blue); color: #fff; border-color: var(--blue);
    box-shadow: 0 2px 12px rgba(75,147,255,0.3);
  }
  .m-btn.confirm:hover { opacity: 0.88; }

  /* ── Toast ── */
  #toast {
    position: fixed; bottom: 20px; right: 20px; z-index: 200;
    padding: 10px 18px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    font-size: 13px; font-weight: 500;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    transform: translateY(12px); opacity: 0;
    transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1);
    pointer-events: none; max-width: 300px;
  }
  #toast.show { transform: translateY(0); opacity: 1; }

  /* ── Divider ── */
  .section-divider {
    font-size: 11px; font-weight: 600;
    color: var(--text3); text-transform: uppercase;
    letter-spacing: 1px; margin-bottom: 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .section-divider::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
  }
</style>
</head>
<body>

<div class="wrap">

  <!-- Header -->
  <div class="header">
    <div class="logo-row">
      <div class="logo-icon">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Ondes gauche -->
      <path d="M3.5 12 Q3.5 7.5 6.5 5" stroke="#4b93ff" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.45"/>
      <path d="M5.5 12 Q5.5 8.8 7.8 7" stroke="#4b93ff" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.7"/>
      <!-- Ondes droite -->
      <path d="M20.5 12 Q20.5 7.5 17.5 5" stroke="#4b93ff" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.45"/>
      <path d="M18.5 12 Q18.5 8.8 16.2 7" stroke="#4b93ff" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.7"/>
      <!-- Corps micro -->
      <rect x="9" y="5" width="6" height="9" rx="3" fill="#4b93ff"/>
      <!-- Arc bas -->
      <path d="M7 13.5 Q7 18 12 18 Q17 18 17 13.5" stroke="#7ab5ff" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <!-- Pied -->
      <line x1="12" y1="18" x2="12" y2="21" stroke="#7ab5ff" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="9" y1="21" x2="15" y2="21" stroke="#7ab5ff" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </div>
      <div>
        <div class="logo-title">Alexa Manager</div>
        <div class="logo-sub">Gestion des phrases vocales · Home Assistant</div>
      </div>
    </div>
    <div class="header-right">
      <div class="pill">
        <div class="dot" id="connDot"></div>
        <span id="connLabel">Connexion…</span>
      </div>
      <button class="btn" onclick="load()">↻ Actualiser</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-bar" id="statsBar"></div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" id="tab-lights"  onclick="switchTab('lights')">
      💡 Lumières & Prises <span class="badge" id="badge-lights">0</span>
    </button>
    <button class="tab" id="tab-scenes"  onclick="switchTab('scenes')">
      🎬 Scènes <span class="badge" id="badge-scenes">0</span>
    </button>
    <button class="tab" id="tab-scripts" onclick="switchTab('scripts')">
      ⚡ Scripts <span class="badge" id="badge-scripts">0</span>
    </button>
    <button class="tab" id="tab-climate" onclick="switchTab('climate')">
      🌡️ Climat & Volets <span class="badge" id="badge-climate">0</span>
    </button>
    <button class="tab" id="tab-media"   onclick="switchTab('media')">
      📺 Médias <span class="badge" id="badge-media">0</span>
    </button>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-inp" id="searchInp" placeholder="Rechercher un appareil…" oninput="renderCurrent()">
    </div>
    <select class="filter-sel" id="filterState" onchange="renderCurrent()">
      <option value="all">Tous les états</option>
      <option value="on">Allumés / Actifs</option>
      <option value="off">Éteints</option>
    </select>
  </div>

  <div class="grid" id="grid"></div>

</div>

<!-- Modal rename -->
<div class="modal-overlay" id="modalOv">
  <div class="modal">
    <div class="modal-title">Renommer pour Alexa</div>
    <div class="modal-sub" id="modalSub"></div>
    <label class="modal-lbl">Nouveau nom</label>
    <input class="modal-inp" id="modalInp" type="text" placeholder="Ex: Lumière salon">
    <div class="modal-preview">
      🎙 Alexa dira : <strong>"Alexa, allume <span id="modalPreview">…</span>"</strong>
    </div>
    <div class="modal-btns">
      <button class="m-btn cancel" onclick="closeModal()">Annuler</button>
      <button class="m-btn confirm" onclick="confirmRename()">Enregistrer</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const API_BASE = window.location.origin + window.location.pathname.replace(/\/$/, '');

let allEntities = [];
let currentTab  = 'lights';
let renameTarget = null;

const ICONS = {
  light:'💡', switch:'🔌', scene:'🎬', script:'⚡',
  media_player:'📺', climate:'🌡️', cover:'🪟',
  fan:'🌀', input_boolean:'🔘',
};

const ICON_BG = {
  light:'var(--yellow-dim)', switch:'var(--blue-dim)',
  scene:'var(--purple-dim)', script:'var(--teal-dim)',
  media_player:'var(--orange-dim)', climate:'var(--green-dim)',
  cover:'var(--red-dim)', fan:'var(--teal-dim)',
  input_boolean:'var(--blue-dim)',
};

// ── Chargement ─────────────────────────────────────────────────────
async function load() {
  showSkeletons();
  try {
    const res = await fetch(`${API_BASE}/api/states`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    allEntities = await res.json();
    setConn(true);
    updateBadges();
    updateStats();
    renderCurrent();
  } catch(e) {
    setConn(false);
    toast('Impossible de charger les entités', 'error');
  }
}

function setConn(on) {
  document.getElementById('connDot').className = 'dot' + (on ? '' : ' off');
  document.getElementById('connLabel').textContent = on ? 'Connecté' : 'Hors ligne';
}

function domain(e) { return e.entity_id.split('.')[0]; }

function tabEntities(tab) {
  const map = {
    lights:  e => ['light','switch','input_boolean','fan'].includes(domain(e)),
    scenes:  e => domain(e) === 'scene',
    scripts: e => domain(e) === 'script',
    climate: e => ['climate','cover'].includes(domain(e)),
    media:   e => domain(e) === 'media_player',
  };
  return allEntities.filter(map[tab] || (() => false));
}

function filtered(entities) {
  const q = document.getElementById('searchInp').value.toLowerCase();
  const s = document.getElementById('filterState').value;
  return entities.filter(e => {
    const name = (e.attributes.friendly_name || e.entity_id).toLowerCase();
    const mq = !q || name.includes(q) || e.entity_id.includes(q);
    const ms = s === 'all' || e.state === s || (s==='on' && ['on','playing','open'].includes(e.state));
    return mq && ms;
  });
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  renderCurrent();
}

function renderCurrent() { render(filtered(tabEntities(currentTab))); }

function updateBadges() {
  ['lights','scenes','scripts','climate','media'].forEach(t =>
    document.getElementById('badge-' + t).textContent = tabEntities(t).length
  );
}

function updateStats() {
  const d = {
    total:   allEntities.length,
    lights:  allEntities.filter(e => domain(e) === 'light').length,
    scripts: allEntities.filter(e => domain(e) === 'script').length,
    scenes:  allEntities.filter(e => domain(e) === 'scene').length,
    on:      allEntities.filter(e => e.state === 'on').length,
  };
  document.getElementById('statsBar').innerHTML = `
    <div class="stat"><div class="stat-icon" style="background:var(--surface3)">🏠</div>Entités <strong>${d.total}</strong></div>
    <div class="stat"><div class="stat-icon" style="background:var(--yellow-dim)">💡</div>Lumières <strong>${d.lights}</strong></div>
    <div class="stat"><div class="stat-icon" style="background:var(--teal-dim)">⚡</div>Scripts <strong>${d.scripts}</strong></div>
    <div class="stat"><div class="stat-icon" style="background:var(--purple-dim)">🎬</div>Scènes <strong>${d.scenes}</strong></div>
    <div class="stat"><div class="stat-icon" style="background:var(--green-dim)">✅</div>Actifs <strong>${d.on}</strong></div>
  `;
}

function render(entities) {
  const grid = document.getElementById('grid');
  if (!entities.length) {
    grid.innerHTML = `<div class="empty"><div class="ico">🔍</div>Aucun résultat</div>`;
    return;
  }

  grid.innerHTML = entities.map(e => {
    const name  = e.attributes.friendly_name || e.entity_id;
    const dom   = domain(e);
    const icon  = ICONS[dom] || '📦';
    const ibg   = ICON_BG[dom] || 'var(--surface3)';
    const sc    = ['on','playing','open','active'].includes(e.state) ? 's-on' : e.state === 'off' ? 's-off' : 's-other';
    const tc    = {light:'t-light',switch:'t-switch',scene:'t-scene',script:'t-script',media_player:'t-media',climate:'t-climate',cover:'t-cover'}[dom] || 't-other';
    const phrase = alexaPhrase(dom, name);
    const eid   = e.entity_id.replace(/'/g,"\\'");
    const nesc  = name.replace(/'/g,"\\'").replace(/"/g,'&quot;');

    return `<div class="card">
      <div class="card-top">
        <div class="c-icon" style="background:${ibg}">${icon}</div>
        <div class="c-info">
          <div class="c-name">${name}</div>
          <div class="c-id">${e.entity_id}</div>
        </div>
        <div class="c-right">
          <span class="t-badge ${tc}">${dom}</span>
          <span class="s-badge ${sc}">${e.state}</span>
        </div>
      </div>
      <div class="phrase-box">
        <div class="phrase-lbl">🎙 Dire à Alexa</div>
        <div class="phrase-txt">${phrase}</div>
      </div>
      <div class="c-actions">
        <button class="act rename" onclick="openRename('${eid}','${nesc}')">✏️ Renommer</button>
        <button class="act test" id="tog-${e.entity_id}" onclick="toggle('${eid}','${dom}')">▶ Tester</button>
        <button class="act copy" onclick="copyTxt('${phrase.replace(/<[^>]+>/g,'').replace(/'/g,"\\'")}')">📋 Copier</button>
      </div>
    </div>`;
  }).join('');
}

function alexaPhrase(dom, name) {
  const n = `<strong>${name}</strong>`;
  return {
    light:         `<em>Alexa,</em> allume ${n} <em>· ou ·</em> éteins ${n}`,
    switch:        `<em>Alexa,</em> allume ${n} <em>· ou ·</em> éteins ${n}`,
    input_boolean: `<em>Alexa,</em> active ${n}`,
    fan:           `<em>Alexa,</em> allume ${n}`,
    scene:         `<em>Alexa,</em> active ${n}`,
    script:        `<em>Alexa,</em> active ${n}`,
    media_player:  `<em>Alexa,</em> allume ${n} <em>· ou ·</em> arrête ${n}`,
    climate:       `<em>Alexa,</em> règle ${n} sur 21 degrés`,
    cover:         `<em>Alexa,</em> ouvre ${n} <em>· ou ·</em> ferme ${n}`,
  }[dom] || `<em>Alexa,</em> active ${n}`;
}

function showSkeletons() {
  document.getElementById('grid').innerHTML = Array(9).fill('').map(() => `
    <div class="card">
      <div class="card-top" style="margin-bottom:12px">
        <div class="skeleton" style="width:36px;height:36px;border-radius:10px;flex-shrink:0"></div>
        <div style="flex:1;display:flex;flex-direction:column;gap:6px">
          <div class="skeleton" style="height:12px;width:60%"></div>
          <div class="skeleton" style="height:10px;width:40%"></div>
        </div>
      </div>
      <div class="skeleton" style="height:52px;border-radius:9px;margin-bottom:10px"></div>
      <div style="display:flex;gap:6px">
        <div class="skeleton" style="flex:1;height:30px;border-radius:9px"></div>
        <div class="skeleton" style="flex:1;height:30px;border-radius:9px"></div>
        <div class="skeleton" style="flex:1;height:30px;border-radius:9px"></div>
      </div>
    </div>`).join('');
}

// ── Rename ──────────────────────────────────────────────────────────
function openRename(eid, name) {
  renameTarget = eid;
  document.getElementById('modalInp').value = name;
  document.getElementById('modalPreview').textContent = name;
  document.getElementById('modalSub').textContent = eid;
  document.getElementById('modalOv').classList.add('open');
  setTimeout(() => document.getElementById('modalInp').focus(), 200);
}

function closeModal() {
  document.getElementById('modalOv').classList.remove('open');
  renameTarget = null;
}

document.getElementById('modalInp').addEventListener('input', function() {
  document.getElementById('modalPreview').textContent = this.value || '…';
});

document.getElementById('modalOv').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

async function confirmRename() {
  const newName = document.getElementById('modalInp').value.trim();
  if (!newName || !renameTarget) return;
  try {
    await fetch(`${API_BASE}/api/config/entity_registry/${renameTarget}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: newName })
    });
    const entity = allEntities.find(e => e.entity_id === renameTarget);
    if (entity) entity.attributes.friendly_name = newName;
    closeModal();
    renderCurrent();
    toast(`✅ "${newName}" enregistré`, 'success');
  } catch {
    toast('Erreur lors du renommage', 'error');
  }
}

// ── Toggle ──────────────────────────────────────────────────────────
async function toggle(eid, dom) {
  const btn = document.getElementById('tog-' + eid);
  if (btn) { btn.textContent = '…'; btn.disabled = true; }
  const svcMap = { scene:['scene','turn_on'], script:['script','turn_on'], cover:['cover','toggle'], climate:['climate','toggle'] };
  const [sd, svc] = svcMap[dom] || ['homeassistant','toggle'];
  try {
    const res = await fetch(`${API_BASE}/api/services/${sd}/${svc}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ entity_id: eid })
    });
    if (res.ok) {
      toast('Activé ✓', 'success');
      if (btn) { btn.textContent = '✓'; setTimeout(() => { btn.textContent = '▶ Tester'; btn.disabled = false; }, 2000); }
      setTimeout(load, 1500);
    } else throw new Error();
  } catch {
    toast('Erreur lors du test', 'error');
    if (btn) { btn.textContent = '▶ Tester'; btn.disabled = false; }
  }
}

// ── Copy ────────────────────────────────────────────────────────────
function copyTxt(txt) {
  navigator.clipboard.writeText(txt).then(() => toast('Copié dans le presse-papiers', 'success'));
}

// ── Toast ────────────────────────────────────────────────────────────
let toastT;
function toast(msg, type = 'info') {
  const el = document.getElementById('toast');
  
  const colors = { success: '#2ecc71', error: '#e74c3c', info: '#4b93ff', warning: '#f1c40f' };
  el.style.borderColor = colors[type] || colors.info;
  el.style.color = colors[type] || colors.info;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), 3500);
}

// ── Init ─────────────────────────────────────────────────────────────
load();
setInterval(load, 60000);
</script>
